version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # Do NOT set VITE_* secrets in Amplify env vars — Vite inlines them
        # into the public bundle. See README § Deploying.
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
