<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Live content</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: linear-gradient(135deg, #f6f8fb, #e9f0fa);
        color: #0b0b0b;
      }
      .card {
        max-width: 520px;
        padding: 40px 44px;
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 12px 40px rgba(16, 42, 90, 0.12);
        text-align: center;
      }
      h1 { margin: 0 0 10px; font-size: 26px; }
      p { margin: 6px 0; color: #52514e; line-height: 1.6; }
      code {
        padding: 2px 7px;
        border-radius: 6px;
        background: #eef3fa;
        color: #1c5cab;
        font-size: 0.92em;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>⚛️ Hello from the Live repo</h1>
      <p>This page is <code>content/index.html</code> in <strong>PrajwalShete/Live</strong> on GitHub.</p>
      <p>Edit it, push, and hit <code>⟳ Refresh</code> in the Reactor Hub — the new version appears instantly.</p>
    </main>
  </body>
</html>
